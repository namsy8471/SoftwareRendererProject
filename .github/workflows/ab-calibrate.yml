# A/B 벤치 검증 실험(A/A): 같은 커밋을 base·head 양쪽에 두고 재서, 판정이 우연히 "개선/느려짐"을 내는 비율을 센다.
# - same : ab-bench.yml과 같은 방식(한 폴더, /Brepro). 바이트까지 같은 실행 파일을 일부러 -Force로 잰다 → 순수 측정 잡음.
# - split: 예전 방식(base는 RUNNER_TEMP/base, head는 작업 폴더, /Brepro 없음) → 빌드 위치 차이가 잡음 위에 얹히는지 본다.
# 모드 × 방식 × 반복마다 별도 VM에서 돈다. 결과는 요약과 PR 댓글(<!-- sr-ab-calibrate -->)로 나온다.
# 수동: gh workflow run ab-calibrate.yml --ref <브랜치> -f repeats=3
name: A/B bench calibration

on:
  pull_request:
    paths:
      - '.github/workflows/ab-calibrate.yml'
  workflow_dispatch:
    inputs:
      repeats:
        description: 모드·방식마다 반복 횟수
        default: '3'

concurrency:
  group: ab-calibrate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      reps: ${{ steps.r.outputs.reps }}
    steps:
      - id: r
        env:
          N: ${{ inputs.repeats || '3' }}
        run: |
          "reps=$(ConvertTo-Json -Compress @(1..[int]$env:N))" >> $env:GITHUB_OUTPUT

  aa:
    name: A/A ${{ matrix.layout }} ${{ matrix.mode }} #${{ matrix.rep }}
    needs: plan
    runs-on: windows-2025
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 9 # 다른 PR의 CI가 쓸 동시 job 자리를 남긴다(Free 플랜 약 20개).
      matrix:
        mode: [fill, wire, normal]
        layout: [same, split]
        rep: ${{ fromJSON(needs.plan.outputs.reps) }}
    steps:
      - uses: actions/checkout@v4

      - name: Build srcli (${{ matrix.layout }})
        env:
          LAYOUT: ${{ matrix.layout }}
        run: |
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $msbuild = Join-Path $vs 'MSBuild/Current/Bin/MSBuild.exe'
          function Build([string]$dir) {
            & $msbuild (Join-Path $dir 'SrCli.vcxproj') /m /nologo /v:minimal /p:Configuration=Release /p:Platform=x64 "/p:SolutionDir=$dir\"
            if ($LASTEXITCODE -ne 0) { throw "srcli build failed: $dir" }
          }
          $bin = Join-Path $env:RUNNER_TEMP 'bin'
          New-Item -ItemType Directory -Force $bin | Out-Null
          if ($env:LAYOUT -eq 'same') {
            # ab-bench.yml과 같은 방식. 같은 커밋이므로 두 번 빌드하는 대신 한 번 빌드해 양쪽에 복사한다(결과는 같다).
            $env:CL = '/Brepro'; $env:LINK = '/Brepro'
            $src = Join-Path $env:RUNNER_TEMP 'src'
            git worktree add --detach $src HEAD
            Build $src
            foreach ($side in 'base', 'head') { Copy-Item (Join-Path $src 'tools/bin/x64/Release') (Join-Path $bin $side) -Recurse }
          } else {
            # PR #10 첫 버전과 같은 방식: base는 별도 worktree, head는 작업 폴더, /Brepro 없음.
            $baseDir = Join-Path $env:RUNNER_TEMP 'base'
            git worktree add --detach $baseDir HEAD
            Build $baseDir
            Build $PWD.Path
            Copy-Item (Join-Path $baseDir 'tools/bin/x64/Release') (Join-Path $bin 'base') -Recurse
            Copy-Item 'tools/bin/x64/Release' (Join-Path $bin 'head') -Recurse
          }
          $hb = (Get-FileHash (Join-Path $bin 'base/srcli.exe')).Hash
          $hh = (Get-FileHash (Join-Path $bin 'head/srcli.exe')).Hash
          Write-Output "srcli.exe sha256 base $hb head $hh"
          New-Item -ItemType Directory -Force ab | Out-Null
          @{ layout = $env:LAYOUT; exe_identical = ($hb -eq $hh) } | ConvertTo-Json -Compress | Set-Content ab/build.json

      - name: A/A benchmark (forced)
        run: >
          ./tools/ci/AB-Bench.ps1 -Mode ${{ matrix.mode }} -Force
          -Base "$env:RUNNER_TEMP/bin/base/srcli.exe"
          -Head "$env:RUNNER_TEMP/bin/head/srcli.exe"
          -Out ab/bench.jsonl

      - name: Analyze
        run: |
          ./tools/ci/AB-Report.ps1 -InputPath ab/bench.jsonl -Title 'A/A ${{ matrix.layout }} ${{ matrix.mode }} #${{ matrix.rep }}' -ResultPath ab/result.json -SummaryPath $env:GITHUB_STEP_SUMMARY
          $r = @(Get-Content -Raw ab/result.json | ConvertFrom-Json)[0]
          $b = Get-Content -Raw ab/build.json | ConvertFrom-Json
          $r | Add-Member layout $b.layout
          $r | Add-Member rep ${{ matrix.rep }}
          $r | Add-Member exe_identical $b.exe_identical
          $r | ConvertTo-Json -Compress | Set-Content ab/aa-${{ matrix.layout }}-${{ matrix.mode }}-${{ matrix.rep }}.json

      - uses: actions/upload-artifact@v4
        with:
          name: aa-${{ matrix.layout }}-${{ matrix.mode }}-${{ matrix.rep }}
          path: |
            ab/aa-*.json
            ab/bench.jsonl
          retention-days: 30

  summary:
    name: Calibration summary
    needs: aa
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: aa-*
          path: aa
      - name: Summarize
        run: |
          $rows = @(Get-ChildItem aa -Recurse -Filter 'aa-*.json' | ForEach-Object { Get-Content -Raw $_.FullName | ConvertFrom-Json })
          $md = [System.Collections.Generic.List[string]]::new()
          $md.Add('<!-- sr-ab-calibrate -->')
          $md.Add('### A/B 벤치 검증 (A/A: 같은 코드끼리)')
          $md.Add('')
          $md.Add('같은 커밋을 base·head 양쪽에 놓고 30라운드씩 잰 결과다. 진짜 차이는 0이므로 ✅/❌ 판정은 모두 오판이다.')
          $md.Add('')
          $md.Add('| 방식 | 모드 | 실행 | exe 동일 | 오판(현재 규칙: 유의+2%) | 유의만 본 예전 규칙의 오판 | mean 변화 (실행별) | p95 변화 (실행별) |')
          $md.Add('|---|---|---|---|---|---|---|---|')
          $fmt = { param($v) '{0:+0.0;-0.0;0.0}' -f [double]$v }
          foreach ($layout in 'same', 'split') {
            foreach ($mode in 'fill', 'wire', 'normal') {
              $g = @($rows | Where-Object { $_.layout -eq $layout -and $_.mode -eq $mode } | Sort-Object rep)
              if ($g.Count -eq 0) { continue }
              $flag = @($g | Where-Object { $_.verdict -in 'improved', 'regressed', 'mixed' }).Count
              $old = @($g | Where-Object { $_.mean_sig -or $_.p95_sig }).Count
              $same = @($g | Where-Object { $_.exe_identical }).Count
              $md.Add(('| {0} | {1} | {2} | {3}/{2} | **{4}** | {5} | {6} | {7} |' -f $layout, $mode, $g.Count, $same, $flag, $old,
                (($g | ForEach-Object { & $fmt $_.mean_pct }) -join ', '), (($g | ForEach-Object { & $fmt $_.p95_pct }) -join ', ')))
            }
          }
          foreach ($layout in 'same', 'split') {
            $g = @($rows | Where-Object layout -eq $layout)
            if ($g.Count -eq 0) { continue }
            $flag = @($g | Where-Object { $_.verdict -in 'improved', 'regressed', 'mixed' }).Count
            $old = @($g | Where-Object { $_.mean_sig -or $_.p95_sig }).Count
            $md.Add('')
            $md.Add(('- **{0}**: {1}회 중 현재 규칙 오판 {2}회, 예전 규칙(유의만) 오판 {3}회.' -f $layout, $g.Count, $flag, $old))
          }
          $md.Add('')
          $md.Add('same = ab-bench.yml 방식(한 폴더, /Brepro), split = 예전 방식(다른 폴더, /Brepro 없음). 변화율 단위는 %, 음수 = head가 빠름.')
          $text = $md -join "`n"
          Write-Output $text
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $text -Encoding utf8
          Set-Content -Path comment.md -Value $text -Encoding utf8

      - name: PR comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr comment $env:PR --repo $env:GITHUB_REPOSITORY --body-file comment.md
