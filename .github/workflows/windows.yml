# Windows CI: 사용자 PC(self-hosted runner, 라벨 renderer-pc)에서 MSVC로 빌드·테스트·벤치·품질 검사를 돌린다.
# 성능 판정 기준(CLAUDE.md)은 이 PC의 Release x64 수치다. GitHub 공용 runner는 CPU가 달라 판정에 쓰지 않는다.
#
# 보안: 공개 저장소라 남의 fork에서 온 PR이 이 PC에서 코드를 실행하면 안 된다.
# 그래서 PR은 같은 저장소 브랜치에서 온 것만 받는다(job마다 if 조건).
name: Windows (PC)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 한 PC에서 벤치가 겹치면 수치가 서로 흔들린다. 같은 브랜치의 이전 실행은 취소한다.
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read # main의 이전 벤치 결과(artifact)를 내려받아 비교하는 데 필요

defaults:
  run:
    shell: pwsh

jobs:
  build-test-bench:
    name: MSVC Release x64 (tests + 1080p bench)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, renderer-pc]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build + test (unit + golden)
        run: ./tests/RunTests.ps1 -Quick

      - name: Upload golden diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-golden-diffs
          path: tests/out/golden/
          if-no-files-found: ignore

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-logs
          path: tests/bin/logs/
          if-no-files-found: ignore

      # CLAUDE.md 판정 조건 그대로: fill/wire/normal, 1920x1080, 모드마다 3회 중앙값.
      - name: Benchmark (1920x1080, 3 runs)
        run: |
          ./tests/Bench.ps1 -Runs 3 -Label ci
          $file = Get-ChildItem tests/out/bench/*-ci.jsonl | Sort-Object LastWriteTime | Select-Object -Last 1
          New-Item -ItemType Directory -Force bench | Out-Null
          Copy-Item $file.FullName bench/bench.jsonl

      # main이 아니면 main의 마지막 성공한 실행에서 벤치 결과를 가져와 비교 기준으로 쓴다. 없으면 이번 수치만 보여 준다.
      - name: Fetch main baseline
        if: github.ref != 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $runId = gh run list --repo $env:GITHUB_REPOSITORY --workflow windows.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId'
          if ($runId) { gh run download $runId --repo $env:GITHUB_REPOSITORY --name bench-windows --dir baseline }
          else { Write-Output 'main baseline 없음' }

      # 지금은 보고만 한다. normal 모드가 아직 p95 9ms를 못 넘어서 절대 기준으로는 실패시키지 않는다.
      # 수치가 안정되면 -FailOnRegressionPct 5 같은 값을 넣어 main 대비 회귀만 실패로 만든다.
      - name: Report benchmark
        run: ./tools/ci/Compare-Bench.ps1 -Current bench/bench.jsonl -Baseline baseline/bench.jsonl -SummaryPath $env:GITHUB_STEP_SUMMARY

      - name: Upload benchmark
        uses: actions/upload-artifact@v4
        with:
          name: bench-windows
          path: bench/bench.jsonl
          retention-days: 90

  analyze:
    name: MSVC /analyze (static analysis)
    needs: build-test-bench # 벤치가 끝난 뒤에 돌아 측정을 방해하지 않게 한다
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, renderer-pc]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # /analyze 경고도 /WX로 오류가 된다. 외부 헤더(src/ThirdParty)는 /analyze:external-로 뺀다.
      - name: Build with /analyze + test
        run: ./tests/RunTests.ps1 -Quick -MSBuildArgs '/p:SrAnalyze=true'

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-analyze-logs
          path: tests/bin/logs/
          if-no-files-found: ignore

  asan:
    name: MSVC AddressSanitizer (Debug x64)
    needs: build-test-bench
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, renderer-pc]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Debug|x64는 BuildSettings.props에서 이미 EnableASAN(/fsanitize=address)이다. 명시적으로 한 번 더 켠다.
      - name: Build with /fsanitize=address + test
        run: ./tests/RunTests.ps1 -Configurations Debug -Platforms x64 -MSBuildArgs '/p:EnableASAN=true'

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-asan-logs
          path: tests/bin/logs/
          if-no-files-found: ignore
