name: Windows four-configuration verification

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full commit SHA of the candidate
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.platform }} ${{ matrix.configuration }} rebuild and tests
    runs-on: windows-2025
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, Win32]
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
      - name: Rebuild and test
        shell: pwsh
        env:
          SR_REVISION: ${{ inputs.revision }}
          SR_PLATFORM: ${{ matrix.platform }}
          SR_CONFIGURATION: ${{ matrix.configuration }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SR_REVISION -notmatch '^[a-f0-9]{40}$') { throw 'A full commit SHA is required.' }
          $actual = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:SR_REVISION) { throw "Unexpected checkout: $actual" }
          ./tests/RunTests.ps1 -Rebuild -Platforms $env:SR_PLATFORM -Configurations $env:SR_CONFIGURATION
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-${{ matrix.platform }}-${{ matrix.configuration }}
          path: |
            tests/bin/logs/
            tests/out/golden/
          if-no-files-found: ignore