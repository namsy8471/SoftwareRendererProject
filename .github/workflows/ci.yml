# Linux CI: push/PR마다 CMake+GCC로 headless 렌더러를 빌드하고 단위 테스트와 골든 이미지 테스트를 돌린다.
# linux-sanitize job은 같은 테스트를 ASan(메모리 오류)+UBSan(정의되지 않은 동작) 빌드로 다시 돌린다.
# Win32 앱과 MSVC 빌드는 windows.yml(사용자 PC의 self-hosted runner)에서 다룬다.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# PR 브랜치는 새 push가 오면 이전 실행을 취소한다. main은 커밋마다 따로 둬서, 연달아 머지해도 앞 머지의 검사가 끝까지 돈다.
concurrency:
  group: ci-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (GCC, headless)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # CODEMAP.md(파일별 역할 표)가 소스 파일 추가·삭제를 따라가는지 확인한다. 빌드 전이라 몇 초 안에 끝난다.
      - name: Check CODEMAP.md
        run: python3 tools/ci/check_codemap.py "$GITHUB_WORKSPACE"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release

      - name: Test (unit + golden)
        run: ./out/release/RendererTests "$GITHUB_WORKSPACE"

      # 골든 테스트가 실패하면 actual/diff PNG를 내려받아 바로 비교할 수 있게 올린다.
      - name: Upload golden diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-diffs
          path: tests/out/golden/
          if-no-files-found: ignore

      # 참고용 성능 수치. 공용 runner는 CPU를 나눠 써서 측정값이 흔들리므로 실패 조건으로 쓰지 않는다.
      - name: Benchmark (informational)
        continue-on-error: true
        run: |
          for mode in fill wire normal; do
            ./out/release/srcli bench --mode "$mode" --json | tee -a bench.jsonl
          done
          {
            echo '### Benchmark (shared runner, 참고용)'
            echo '```'
            cat bench.jsonl
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  linux-sanitize:
    name: Linux (GCC, ASan + UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # 첫 오류에서 멈추고, 어느 줄인지 스택을 남긴다.
      ASAN_OPTIONS: abort_on_error=1:detect_leaks=1:strict_string_checks=1:check_initialization_order=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build

      - name: Configure
        run: cmake --preset sanitize

      - name: Build
        run: cmake --build --preset sanitize

      - name: Test (unit + golden, sanitized)
        run: ./out/sanitize/RendererTests "$GITHUB_WORKSPACE"

      # 런타임 검사가 srcli의 실제 렌더 경로(타일 병렬, 선, 후처리)도 지나가게 짧게 한 번씩 돌린다.
      - name: srcli smoke (sanitized)
        run: |
          for mode in fill wire normal aabb fxaa; do
            ./out/sanitize/srcli bench --mode "$mode" --size 640x360 --warmup 2 --frames 5 --json
          done
